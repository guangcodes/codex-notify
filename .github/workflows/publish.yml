name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from codex_notify import __version__

          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY
      - run: PYTHONPATH=src PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python scripts/verify_wheel_install.py
      - run: python -m compileall -q src scripts tests
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution_contents.py dist/*.whl dist/*.tar.gz
      - name: Verify built wheel outside source checkout
        shell: bash
        run: |
          smoke_dir="${RUNNER_TEMP}/codex-notify-release-wheel"
          python -m venv "${smoke_dir}/venv"
          "${smoke_dir}/venv/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${smoke_dir}/venv/bin/codex-notify" --version
          "${smoke_dir}/venv/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_wheel_install.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Attach the exact distribution files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --repo "${{ github.repository }}" --clobber
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Verify GitHub Release and PyPI hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/verify_release_integrity.py
          --repository "${{ github.repository }}"
          --tag "$RELEASE_TAG"
          --dist dist
